version: '3.9'

services:
  db:
    image: postgres:18-alpine
    container_name: sistema_ventas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ventas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ventas_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_ventas}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ventas_user} -d ${POSTGRES_DB:-sistema_ventas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistema_ventas_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-ventas_user}:${POSTGRES_PASSWORD:-ventas_pass}@db:5432/${POSTGRES_DB:-sistema_ventas}
      DB_SSL: 'false'
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me_in_production_min_32_chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/auth/google/callback}
      TZ: America/La_Paz
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/health || exit 1"]
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: http://backend:3001
    container_name: sistema_ventas_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
