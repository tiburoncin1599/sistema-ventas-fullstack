# Sprint 5 — Endurecimiento de producción
# Todas las variables de entorno se inyectan desde .env.production (env_file).
# Plantilla de referencia: .env.production.example

services:
  db:
    image: postgres:18-alpine
    container_name: sistema_ventas_db
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Volumen nombrado y aislado: sobrevive a `down` (sin -v) y a recreate.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER:-ventas_user} -d $${POSTGRES_DB:-sistema_ventas}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistema_ventas_backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Explícito por servicio: env_file es común a todos los contenedores.
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - app_network
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:$${PORT:-3001}/health || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Se resuelve en tiempo de build (Next rewrites). En runtime se usa el
        # mismo valor desde .env.production.
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:3001}
    container_name: sistema_ventas_frontend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # El Dockerfile ya define PORT=3000; se repite para claridad y healthcheck.
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - app_network
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:$${PORT:-3000}/ || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    # Nombre explícito e igual al ya existente: conserva los datos actuales.
    name: sistema-ventas-fullstack_postgres_data

networks:
  app_network:
    driver: bridge
